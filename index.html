<script>
function showTab(tabName, evt) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.style.display = 'none'; });
  document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.classList.remove('active'); });
  document.getElementById('tab-' + tabName).style.display = 'block';
  evt.currentTarget.classList.add('active');
}

var STRICT_PROJECTS = ['Legal dictation','Legal proceedings','All','Law'];
function modeFor(project, override) {
  if (override === 'strict' || override === 'edited') return override;
  return STRICT_PROJECTS.indexOf(project) > -1 ? 'strict' : 'edited';
}
function pad(n, w) { return String(n).padStart(w || 2, '0'); }
function fmtTs(ms) {
  ms = Math.max(0, Math.round(ms));
  var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000), r = ms % 1000;
  return pad(h) + ':' + pad(m) + ':' + pad(s) + '.' + pad(r, 3);
}
function parseAudioLength(str) {
  str = (str || '').trim(); if (!str) return 0;
  var p = str.split(':').map(function(x) { return parseInt(x, 10); });
  if (p.some(isNaN)) return 0;
  if (p.length === 1) return p[0] * 60000;
  if (p.length === 2) return (p[0] * 60 + p[1]) * 1000;
  return (p[0] * 3600 + p[1] * 60 + p[2]) * 1000;
}
function formatDuration(sec) {
  sec = Math.round(sec);
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return h + ':' + pad(m) + ':' + pad(s);
  return m + ':' + pad(s);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function generateSevenWordTitle(rawText) {
  if (!rawText || !rawText.trim()) return "Discussion on Key Business and Industry Insights";
  var cleaned = rawText.replace(/Speaker\s*\d+/gi, ' ').replace(/\(\d+:\d+(?::\d+)?\)/g, ' ').replace(/[^a-zA-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  var stopWords = new Set(['the','and','a','to','of','in','i','is','that','it','for','you','was','with','on','as','have','be','this','are','or','by','not','at','from','we','an','your']);
  var words = cleaned.split(' ').filter(function(w) { return w.length > 2 && !stopWords.has(w.toLowerCase()); });
  if (words.length < 3) return "Comprehensive Transcript Analysis and Overview Summary Report";
  var freq = {}; words.forEach(function(w) { var cap = w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); freq[cap] = (freq[cap] || 0) + 1; });
  var sorted = Object.keys(freq).sort(function(a, b) { return freq[b] - freq[a]; });
  var p1 = sorted[0] || "Industry", p2 = sorted[1] || "Trends", p3 = sorted[2] || "Opportunities";
  var parts = (p1 + " " + p2 + " on " + p3 + " and Future Developments").split(' ');
  while (parts.length < 7) parts.push("Insights");
  return parts.slice(0, 7).map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
}

function parseInput(raw) {
  raw = (raw || '').replace(/\r/g, '').trim();
  if (!raw) return { segments: [], kind: 'none' };
  if (/\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}\s*-->\s*\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}/.test(raw)) return parseSRT(raw);
  return parseTurbo(raw);
}

function parseTurbo(raw) {
  var lines = raw.split('\n'), segs = [], speaker = 'Speaker 1', open = null;
  var re = /\((\d+):(\d{2})(?::(\d{2}))?\)/g;
  lines.forEach(function(line) {
    var t = line.trim(); if (!t) return;
    var sm = /^([A-Za-z0-9_\-\s]+)\s*[:]?\s*$/.exec(t);
    if (sm && !re.test(t)) { speaker = sm[1].trim(); open = null; return; }
    var last = 0, m; re.lastIndex = 0;
    while ((m = re.exec(t)) !== null) {
      var before = t.slice(last, m.index).trim();
      if (before) { if (open) open.text += ' ' + before; else { open = { speaker: speaker, start: 0, text: before }; segs.push(open); } }
      var start = m[3] !== undefined ? ((+m[1]) * 3600 + (+m[2]) * 60 + (+m[3])) * 1000 : ((+m[1]) * 60 + (+m[2])) * 1000;
      open = { speaker: speaker, start: start, text: '' }; segs.push(open); last = m.index + m[0].length;
    }
    var tail = t.slice(last).trim();
    if (tail) { if (open) open.text += (open.text ? ' ' : '') + tail; else { open = { speaker: speaker, start: 0, text: tail }; segs.push(open); } }
  });
  return { segments: segs.filter(function(s) { return s.text.trim(); }), kind: 'text' };
}

function parseSRT(raw) {
  var blocks = raw.split(/\n\s*\n/), segs = [], lastSpk = 'Speaker 1';
  var tre = /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/;
  blocks.forEach(function(b) {
    var lines = b.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
    var ti = -1, tm = null;
    for (var i = 0; i < lines.length; i++) { tm = tre.exec(lines[i]); if (tm) { ti = i; break; } }
    if (ti < 0) return;
    var ms = function(h, m, s, f) { return ((+h) * 3600 + (+m) * 60 + (+s)) * 1000 + parseInt((f + '00').slice(0, 3), 10); };
    var text = lines.slice(ti + 1).join(' ').trim();
    var sp = /^([A-Za-z0-9_\-\s]+)\s*[:\-\u2013]\s*([\s\S]*)$/i.exec(text);
    if (sp) { lastSpk = sp[1].trim(); text = sp[2].trim(); }
    if (!text) return;
    segs.push({ speaker: lastSpk, start: ms(tm[1], tm[2], tm[3], tm[4]), end: ms(tm[5], tm[6], tm[7], tm[8]), text: text });
  });
  return { segments: segs, kind: 'srt' };
}

function buildBlocks(parsed, cfg) {
  var segs = parsed.segments.map(function(s) { return { speaker: s.speaker, start: s.start, end: s.end, text: s.text }; });
  if (parsed.kind === 'text' && cfg.randomMs) {
    var offset = Math.floor(Math.random() * 800) + 100;
    for (var j = 0; j < segs.length; j++) { segs[j].start += offset; offset = (offset + Math.floor(Math.random() * 600) + 200) % 1000 || 142; }
  }
  var audioMs = cfg.audioMs || 0, lastIdx = segs.length - 1;
  segs.forEach(function(s, i) {
    if (parsed.kind === 'text') s.end = i < lastIdx ? segs[i + 1].start : (audioMs > s.start ? audioMs : s.start + 2500);
    else if (cfg.continuous && i < lastIdx) s.end = segs[i + 1].start;
  });
  return segs;
}

// === NEW: Grammar & Punctuation QA Validation Engine ===
function runGrammarQA(transcriptText, mode) {
  var issues = [];
  var lines = transcriptText.split('\n');
  var sentenceCount = 0;
  var errorCount = 0;

  lines.forEach(function(line, idx) {
    var trimmed = line.trim();
    if (!trimmed || trimmed.includes('Transcription Job:') || trimmed.includes('Client:') || 
        trimmed.includes('Transcribed By:') || trimmed.includes('Date:') || 
        trimmed.includes('Audio Length:') || trimmed.startsWith('[') || trimmed.endsWith(']')) {
      return;
    }
    if (trimmed.endsWith(':') && !trimmed.includes('.')) {
      return;
    }

    sentenceCount++;

    // Check 1: Capitalization
    var firstChar = trimmed.charAt(0);
    if (firstChar && firstChar !== '"' && firstChar !== "'" && firstChar !== firstChar.toUpperCase()) {
      issues.push({ level: 'bad', text: 'Line ' + (idx + 1) + ': Sentence starts with lowercase letter ("' + trimmed.slice(0, 25) + '...")' });
      errorCount++;
    }

    // Check 2: Terminal Punctuation
    var lastChar = trimmed.slice(-1);
    if (lastChar && !['.', '?', '!', '"', "'"].includes(lastChar)) {
      issues.push({ level: 'bad', text: 'Line ' + (idx + 1) + ': Missing terminal punctuation (. ? !) at end of sentence.' });
      errorCount++;
    }

    // Check 3: Double Spaces
    if (line.includes('  ')) {
      issues.push({ level: 'warn', text: 'Line ' + (idx + 1) + ': Contains double spaces.' });
    }

    // Check 4: Filler words check for Edited/Clean Verbatim mode
    if (mode === 'edited') {
      var lower = trimmed.toLowerCase();
      var fillers = ['\bum\b', '\buh\b', '\bah\b', '\berm\b', '\byou know\b'];
      fillers.forEach(function(f) {
        var re = new RegExp(f, 'i');
        if (re.test(lower)) {
          issues.push({ level: 'bad', text: 'Line ' + (idx + 1) + ': Clean verbatim mode active, but leftover filler word detected.' });
          errorCount++;
        }
      });
    }

    // Check 5: Unwritten single digits (0-9)
    if (/\b[0-9]\b/.test(trimmed)) {
      issues.push({ level: 'warn', text: 'Line ' + (idx + 1) + ': Single digit numeral found (0-9 should usually be spelled out).' });
    }
  });

  if (issues.length === 0) {
    issues.push({ level: 'ok', text: 'All grammar and punctuation checks passed successfully! Ready for submission.' });
  }

  return { issues: issues, sentenceCount: sentenceCount, errorCount: errorCount };
}

if (typeof document !== 'undefined' && document.getElementById) {
(function() {
  var $ = function(id) { return document.getElementById(id); };
  var manualSpeakers = [];

  function toast(msg) { 
    var t = $('toast'); 
    t.textContent = msg; 
    t.classList.add('show'); 
    setTimeout(function() { t.classList.remove('show'); }, 2200); 
  }

  $('audioFile').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var audioEl = $('player');
    var objectUrl = URL.createObjectURL(file);
    audioEl.src = objectUrl;
    audioEl.onloadedmetadata = function() {
      if (!isNaN(audioEl.duration)) {
        $('audio').value = formatDuration(audioEl.duration);
        toast('Audio length updated automatically: ' + $('audio').value);
      }
    };
  });

  function renderSpeakers() {
    if (!manualSpeakers.length) {
      $('spkBox').innerHTML = '<div class="hint">No manual speakers added yet. Add them above or they will use input labels.</div>';
      return;
    }
    var html = '<table class="spk"><thead><tr><th>Speaker Label</th><th>Action</th></tr></thead><tbody>';
    manualSpeakers.forEach(function(spk, idx) {
      html += '<tr><td><input type="text" value="' + esc(spk) + '" data-idx="' + idx + '" class="manual-spk-input"></td><td><button type="button" class="del-spk" data-idx="' + idx + '">Remove</button></td></tr>';
    });
    html += '</tbody></table>';
    $('spkBox').innerHTML = html;

    document.querySelectorAll('.del-spk').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        manualSpeakers.splice(idx, 1);
        renderSpeakers();
      });
    });
    document.querySelectorAll('.manual-spk-input').forEach(function(input) {
      input.addEventListener('input', function() {
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        manualSpeakers[idx] = this.value;
      });
    });
  }

  $('btnAddSpeaker').addEventListener('click', function() {
    var val = $('newSpeakerInput').value.trim();
    if (!val) return;
    manualSpeakers.push(val);
    $('newSpeakerInput').value = '';
    renderSpeakers();
    toast('Speaker added');
  });

  $('btnGenTitle').addEventListener('click', function() { 
    $('topic').value = generateSevenWordTitle($('raw').value); 
    toast('7-word title generated'); 
  });

  $('btnSample').addEventListener('click', function() {
    $('raw').value = "Speaker 1\n(0:00) Welcome everyone to today's strategy discussion.\nSpeaker 2\n(0:05) Thank you for having me on the call.";
    toast('Sample loaded');
  });

  $('btnClear').addEventListener('click', function() {
    $('raw').value = '';
    toast('Cleared input');
  });

  $('btnCopy').addEventListener('click', function() {
    var outText = $('out').value;
    if (!outText.trim()) {
      toast('No transcript output to copy');
      return;
    }
    navigator.clipboard.writeText(outText).then(function() {
      toast('Copied plain text to clipboard!');
    }).catch(function() {
      $('out').select();
      document.execCommand('copy');
      toast('Copied plain text!');
    });
  });

  $('btnGo').addEventListener('click', function() {
    if (!$('raw').value.trim()) { toast('Paste raw transcript first'); return; }
    if (!$('topic').value.trim()) $('topic').value = generateSevenWordTitle($('raw').value);
    
    var parsed = parseInput($('raw').value);
    var cfg = { randomMs: $('oRandomMs').checked, continuous: $('oContinuous').checked, audioMs: parseAudioLength($('audio').value) };
    var blocks = buildBlocks(parsed, cfg);

    var lines = [
      'Transcription Job: ' + $('topic').value, 
      'Client: ' + $('client').value,
      'Transcribed By: ' + $('by').value, 
      'Date: ' + $('date').value, 
      'Audio Length: ' + ($('audio').value || '5:08'), 
      ''
    ];

    blocks.forEach(function(b) {
      var speakerLabel = b.speaker;
      lines.push(speakerLabel + ':\n[' + fmtTs(b.start) + ' --> ' + fmtTs(b.end) + ']\n' + b.text + '\n');
    });

    lines.push('[END OF RECORDING --> ' + fmtTs(blocks[blocks.length - 1].end) + ']');
    $('out').value = lines.join('\n');

    // === AUTOMATIC QA VALIDATION TRIGGER ===
    var currentMode = modeFor($('project').value, $('mode').value);
    var qaResult = runGrammarQA($('out').value, currentMode);

    var qaHtml = '';
    qaResult.issues.forEach(function(issue) {
      var icon = issue.level === 'ok' ? '✓' : (issue.level === 'warn' ? '⚠' : '✕');
      qaHtml += '<li class="' + issue.level + '"><span class="i">' + icon + '</span><span>' + issue.text + '</span></li>';
    });
    $('qa').innerHTML = qaHtml;

    $('stats').innerHTML = '<span class="badge">Sentences checked: ' + qaResult.sentenceCount + '</span>' +
                           '<span class="badge" style="background:' + (qaResult.errorCount > 0 ? 'var(--bad)' : 'var(--ok)') + ';color:#fff;">Errors flagged: ' + qaResult.errorCount + '</span>';

    toast('Transcript generated & QA checked!');
  });
})();
}
</script>
