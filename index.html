<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcript Studio & AGLE Suite</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-6 max-w-7xl mx-auto">

  <header class="mb-6 border-b border-slate-800 pb-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-teal-400">Transcript Studio & AGLE Suite</h1>
      <p class="text-xs text-slate-400">Accurate Millisecond Randomization & End-Marker Engine</p>
    </div>
    <div class="flex gap-2">
      <button onclick="switchTab('editor')" id="btnTabEd" class="px-3 py-1.5 rounded bg-teal-600 text-xs font-semibold">Editor</button>
      <button onclick="switchTab('audit')" id="btnTabAud" class="px-3 py-1.5 rounded bg-slate-800 text-xs font-semibold text-slate-400">QA Auditor</button>
    </div>
  </header>

  <!-- TAB 1: EDITOR -->
  <main id="tabEditor" class="flex flex-col gap-4 flex-1">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
        <label class="block text-xs font-semibold mb-1 text-slate-300">Transcription Job (7-Word Topic)</label>
        <div class="flex gap-2 mb-3">
          <input type="text" id="topic" placeholder="e.g. Technology Trends and Future Growth Opportunities" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-100">
          <button onclick="autoTitle()" class="bg-slate-700 px-3 py-2 rounded text-xs font-semibold hover:bg-slate-600">Auto</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-xs font-semibold mb-1 text-slate-300">Audio Length</label><input type="text" id="audio" value="5:08" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-100"></div>
          <div><label class="block text-xs font-semibold mb-1 text-slate-300">Transcribed By</label><input type="text" id="by" value="Godhand Benson" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-100"></div>
        </div>
      </div>

      <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 flex flex-col">
        <label class="block text-xs font-semibold mb-1 text-slate-300">Raw Transcript Input</label>
        <textarea id="raw" placeholder="Speaker 1&#10;(0:00) Welcome to our session. (0:05) Let us begin." class="w-full flex-1 bg-slate-900 border border-slate-700 rounded p-2 text-xs mono text-slate-100 min-h-[100px]"></textarea>
        <div class="flex gap-2 mt-2">
          <button onclick="detectSpk()" class="bg-teal-600 px-3 py-1.5 rounded text-xs font-semibold text-white">Detect Speakers</button>
          <button onclick="loadSample()" class="bg-slate-700 px-3 py-1.5 rounded text-xs font-semibold">Load Sample</button>
        </div>
      </div>
    </div>

    <div id="spkBox" class="bg-slate-800/50 p-3 rounded-xl border border-slate-700 text-xs text-slate-400">Speakers will appear here after detection.</div>

    <button onclick="generate()" class="w-full py-3 bg-teal-600 hover:bg-teal-500 font-bold text-sm rounded-xl text-white shadow-lg transition">Generate Formatted Transcript with End-Marker & Random Milliseconds</button>

    <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 flex flex-col flex-1">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-slate-300">Formatted Output</span>
        <button onclick="copyOut()" class="bg-slate-700 px-3 py-1 rounded text-xs font-medium">Copy Text</button>
      </div>
      <textarea id="out" readonly class="w-full bg-slate-950 border border-slate-700 rounded p-3 text-xs mono text-teal-300 min-h-[250px]"></textarea>
    </div>
  </main>

  <!-- TAB 2: AUDITOR -->
  <main id="tabAudit" class="flex flex-col gap-4 flex-1" style="display:none;">
    <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
      <h2 class="text-sm font-bold text-teal-400 mb-2">QA Compliance Auditor</h2>
      <textarea id="auditText" placeholder="Paste transcript here to verify rules..." class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-xs mono text-slate-100 min-h-[150px]"></textarea>
      <button onclick="runAudit()" class="mt-2 bg-teal-600 px-4 py-2 rounded text-xs font-semibold text-white">Scan Violations</button>
      <div id="auditRes" class="mt-3 text-xs"></div>
    </div>
  </main>

  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 bg-slate-100 text-slate-900 px-4 py-2 rounded-full text-xs font-semibold opacity-0 transition-opacity duration-200 pointer-events-none z-50"></div>

  <script>
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.remove('opacity-0'); t.classList.add('opacity-100');
      setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 2000);
    }

    function switchTab(tab) {
      if(tab === 'editor') {
        document.getElementById('tabEditor').style.display = 'flex';
        document.getElementById('tabAudit').style.display = 'none';
        document.getElementById('btnTabEd').className = "px-3 py-1.5 rounded bg-teal-600 text-xs font-semibold text-white";
        document.getElementById('btnTabAud').className = "px-3 py-1.5 rounded bg-slate-800 text-xs font-semibold text-slate-400";
      } else {
        document.getElementById('tabEditor').style.display = 'none';
        document.getElementById('tabAudit').style.display = 'flex';
        document.getElementById('btnTabAud').className = "px-3 py-1.5 rounded bg-teal-600 text-xs font-semibold text-white";
        document.getElementById('btnTabEd').className = "px-3 py-1.5 rounded bg-slate-800 text-xs font-semibold text-slate-400";
      }
    }

    function autoTitle() {
      document.getElementById('topic').value = "Comprehensive Business Analysis and Industry Growth Insights";
      toast('7-word topic generated');
    }

    function loadSample() {
      document.getElementById('raw').value = "Speaker 1\n(0:00) Welcome to our quarterly review meeting. (0:04) Today we discuss tech trends.\nSpeaker 2\n(0:09) Thanks for having me here.";
      autoTitle();
      toast('Sample loaded');
    }

    let speakerMap = {};
    function detectSpk() {
      const raw = document.getElementById('raw').value;
      const matches = raw.match(/Speaker\s*\d+/gi) || ['Speaker 1', 'Speaker 2'];
      const unique = [...new Set(matches)];
      speakerMap = {};
      let m = 0, f = 0;
      unique.forEach((s, idx) => {
        speakerMap[s] = idx === 0 ? 'Male_1' : 'Female_1';
      });
      document.getElementById('spkBox').innerHTML = 'Detected Speakers: ' + Object.keys(speakerMap).map(k => `${k} => ${speakerMap[k]}`).join(', ');
      toast('Speakers mapped successfully');
    }

    function fmtTs(ms) {
      ms = Math.max(0, Math.round(ms));
      let h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000);
      // Explicitly randomize millisecond value between 100 and 900 if zero to ensure realistic values like .236
      let r = (ms % 1000);
      if (r === 0) r = Math.floor(Math.random() * 800) + 100;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(r).padStart(3, '0');
    }

    function parseAudioLength(str) {
      let p = (str || '5:08').split(':').map(x => parseInt(x, 10));
      if (p.length === 1) return p[0] * 60000;
      if (p.length === 2) return (p[0] * 60 + p[1]) * 1000;
      return (p[0] * 3600 + p[1] * 60 + p[2]) * 1000;
    }

    function generate() {
      const raw = document.getElementById('raw').value;
      if (!raw.trim()) { toast('Please input raw transcript text first.'); return; }
      if (!document.getElementById('topic').value.trim()) autoTitle();

      const lines = raw.split('\n');
      let segs = [], currentSpk = 'Speaker 1', currentText = '', currentStart = 0;
      
      lines.forEach(l => {
        l = l.trim();
        if (!l) return;
        if (/^Speaker\s*\d+/i.test(l)) {
          currentSpk = l;
          return;
        }
        let re = /\((\d+):(\d{2})\)(.*)/g, m;
        let found = false;
        while ((m = re.exec(l)) !== null) {
          found = true;
          if (currentText) {
            segs.push({ speaker: currentSpk, start: currentStart, text: currentText.trim() });
          }
          currentStart = ((+m[1]) * 60 + (+m[2])) * 1000 + Math.floor(Math.random() * 700) + 150;
          currentText = m[3];
        }
        if (!found) {
          currentText += ' ' + l;
        }
      });
      if (currentText) {
        segs.push({ speaker: currentSpk, start: currentStart, text: currentText.trim() });
      }

      if (segs.length === 0) {
        segs.push({ speaker: 'Speaker 1', start: 500, text: raw });
      }

      let audioMs = parseAudioLength(document.getElementById('audio').value);
      let outLines = [
        'Transcription Job: ' + document.getElementById('topic').value,
        'Client: Eagle Web',
        'Transcribed By: ' + document.getElementById('by').value,
        'Date: ' + new Date().toLocaleDateString(),
        ''
      ];

      segs.forEach((s, i) => {
        let startStr = fmtTs(s.start);
        let endMs = i < segs.length - 1 ? segs[i+1].start - 200 : s.start + 4500;
        let endStr = fmtTs(endMs);
        let label = speakerMap[s.speaker] || (i % 2 === 0 ? 'Male_1' : 'Female_1');

        outLines.push(label + ':');
        outLines.push('[' + startStr + ' --> ' + endStr + ']');
        outLines.push(s.text + '\n');
      });

      // Explicit End of Recording marker
      let finalEndMs = Math.max(audioMs, segs[segs.length - 1].start + 5000);
      outLines.push('[END OF RECORDING --> ' + fmtTs(finalEndMs) + ']');

      document.getElementById('out').value = outLines.join('\n');
      toast('Transcript generated successfully with randomized milliseconds and end-marker!');
    }

    function copyOut() {
      const text = document.getElementById('out').value;
      if (!text) { toast('Nothing to copy'); return; }
      navigator.clipboard.writeText(text);
      toast('Copied to clipboard!');
    }

    function runAudit() {
      const text = document.getElementById('auditText').value;
      if (!text) { toast('Paste text to audit'); return; }
      let hasEnd = text.includes('[END OF RECORDING');
      let hasTopic = text.includes('Transcription Job:');
      let res = [];
      if (hasEnd) res.push('✅ End-of-recording marker detected.');
      else res.push('❌ Missing [END OF RECORDING --> ...] marker.');
      if (hasTopic) res.push('✅ Topic header detected.');
      else res.push('❌ Missing Transcription Job header.');
      document.getElementById('auditRes').innerHTML = res.join('<br>');
      toast('Audit complete');
    }
  </script>
</body>
</html>
